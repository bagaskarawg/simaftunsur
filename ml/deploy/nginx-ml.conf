# Reverse proxy nginx untuk service klasterisasi SIMAFTUNSUR.
# Salin ke: /etc/nginx/sites-available/ml.domainmu
# Aktifkan : sudo ln -s /etc/nginx/sites-available/ml.domainmu /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# Lalu terbitkan sertifikat: sudo certbot --nginx -d ml.domainmu
# (certbot akan menamb/menyunting blok TLS 443 secara otomatis.)
#
# GANTI 'ml.domainmu' dengan subdomain aslimu.

server {
    listen 80;
    listen [::]:80;
    server_name ml.domainmu;

    # Batasi ukuran body (payload klasterisasi ~ ratusan KB sudah cukup).
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Klasterisasi + bootstrap bisa memakan waktu; beri tenggang cukup.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
