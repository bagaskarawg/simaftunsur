# Reverse proxy untuk service klasterisasi — MODE LARAVEL FORGE.
#
# Site ini menjalankan uvicorn (Python), BUKAN PHP. Di Forge:
#   Site → k-means-service.bahas.tech → "Edit Nginx Configuration"
# lalu GANTI isi blok `location / { ... }` bawaan (yang mengarah ke PHP/
# index.php) dengan blok proxy di bawah. Biarkan bagian lain (listen 443,
# ssl_certificate, log, dsb. yang dikelola Forge) apa adanya. Blok PHP
# `location ~ \.php$` boleh dibiarkan (tak terpakai) atau dihapus.
#
# Setelah simpan: Forge otomatis `nginx -t` + reload. SSL: pasang lewat
# tab "SSL" Forge (Let's Encrypt) — tidak perlu certbot manual.

location / {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Klasterisasi + bootstrap bisa lama; beri tenggang cukup.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}
